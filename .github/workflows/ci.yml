name: CI

on:
  push:
    branches:
      - main
  pull_request:

jobs:
  gates:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        gate:
          - lint
          - format:check
          - typecheck
          - test
          - typecheck:e2e
          - typecheck:m-ui
          - oci:preflight

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: meristem
          POSTGRES_PASSWORD: meristem
          POSTGRES_DB: meristem
        ports:
          - 55432:5432
        options: >-
          --health-cmd "pg_isready -U meristem -d meristem"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Generate join ingress TLS certificates
        if: matrix.gate == 'test'
        run: bun run scripts/certs-dev.ts

      - name: Run ${{ matrix.gate }}
        run: bun run "${{ matrix.gate }}"

      - name: Upload evidence artifacts
        if: always() && matrix.gate == 'test'
        uses: actions/upload-artifact@v4
        with:
          name: evidence-${{ github.sha }}
          path: tests/evidence/
          if-no-files-found: warn
          retention-days: 30

  images:
    runs-on: ubuntu-latest
    needs: gates
    env:
      # compose 插值要求所有 :?required 变量都有值；镜像构建本身不使用这些值
      POSTGRES_PASSWORD: ci-interpolation-only
      OPENSEARCH_INITIAL_PASSWORD: ci-interpolation-only
      MERISTEM_INTERNAL_TOKEN: ci-interpolation-only
      MERISTEM_JWT_SECRET: ci-interpolation-only
      MERISTEM_REGISTRY: ${{ vars.MERISTEM_REGISTRY || 'localhost/meristem' }}
      MERISTEM_TAG: ${{ github.sha }}
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build all service images
        run: docker compose -f ops/compose/meristem.prod.yml --profile node build

      - name: Push images to registry
        # 仅 main 分支且仓库配置了 MERISTEM_REGISTRY 变量时推送
        if: github.ref == 'refs/heads/main' && vars.MERISTEM_REGISTRY != ''
        run: docker compose -f ops/compose/meristem.prod.yml --profile node push
