name: OCI static pipeline

on:
  pull_request:
  push:
    branches:
      - main

jobs:
  oci-preflight:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Validate OCI inventory and build context before dry-run plans
        run: bun run oci:preflight

  oci-static:
    needs: oci-preflight
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        target:
          - core
          - m-deploy
          - m-eventbus
          - m-extension
          - m-log
          - m-net
          - m-policy
          - m-task
          - m-ui-bff
          - node-agent
          - m-ui

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Print ${{ matrix.target }} OCI plan without registry access
        run: bun run oci:build --target=${{ matrix.target }} --dry-run
