name: meristem-opensearch

services:
  opensearch-manager:
    image: ${MERISTEM_OPENSEARCH_IMAGE:?set to the signed OpenSearch image with the Prometheus exporter plugin}
    environment:
      OPENSEARCH_JAVA_OPTS: -Xms1g -Xmx1g
      OPENSEARCH_INITIAL_ADMIN_PASSWORD: ${OPENSEARCH_ADMIN_PASSWORD:?inject from a SecretRef}
      DISABLE_INSTALL_DEMO_CONFIG: "true"
    ulimits:
      memlock:
        soft: -1
        hard: -1
      nofile:
        soft: 65536
        hard: 65536
    volumes:
      - opensearch-manager-data:/usr/share/opensearch/data
      - ./config/opensearch-manager.yml:/usr/share/opensearch/config/opensearch.yml:ro
      - ${MERISTEM_OPENSEARCH_TLS_DIR:?inject managed TLS material}:/usr/share/opensearch/config/certs:ro
    expose:
      - "9200"
      - "9300"
    healthcheck:
      test: ["CMD-SHELL", "curl --fail --silent --cacert /usr/share/opensearch/config/certs/ca.pem --user admin:$${OPENSEARCH_INITIAL_ADMIN_PASSWORD} https://localhost:9200/_cluster/health"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 30s
    networks:
      - meristem-observability

  opensearch-data:
    image: ${MERISTEM_OPENSEARCH_IMAGE:?set to the signed OpenSearch image with the Prometheus exporter plugin}
    environment:
      OPENSEARCH_JAVA_OPTS: -Xms2g -Xmx2g
      OPENSEARCH_INITIAL_ADMIN_PASSWORD: ${OPENSEARCH_ADMIN_PASSWORD:?inject from a SecretRef}
      DISABLE_INSTALL_DEMO_CONFIG: "true"
    ulimits:
      memlock:
        soft: -1
        hard: -1
      nofile:
        soft: 65536
        hard: 65536
    volumes:
      - opensearch-data-data:/usr/share/opensearch/data
      - ./config/opensearch-data.yml:/usr/share/opensearch/config/opensearch.yml:ro
      - ${MERISTEM_OPENSEARCH_TLS_DIR:?inject managed TLS material}:/usr/share/opensearch/config/certs:ro
    expose:
      - "9200"
      - "9300"
    networks:
      - meristem-observability

  opensearch-ingest:
    image: ${MERISTEM_OPENSEARCH_IMAGE:?set to the signed OpenSearch image with the Prometheus exporter plugin}
    environment:
      OPENSEARCH_JAVA_OPTS: -Xms1g -Xmx1g
      OPENSEARCH_INITIAL_ADMIN_PASSWORD: ${OPENSEARCH_ADMIN_PASSWORD:?inject from a SecretRef}
      DISABLE_INSTALL_DEMO_CONFIG: "true"
    ulimits:
      memlock:
        soft: -1
        hard: -1
      nofile:
        soft: 65536
        hard: 65536
    volumes:
      - opensearch-ingest-data:/usr/share/opensearch/data
      - ./config/opensearch-ingest.yml:/usr/share/opensearch/config/opensearch.yml:ro
      - ${MERISTEM_OPENSEARCH_TLS_DIR:?inject managed TLS material}:/usr/share/opensearch/config/certs:ro
    expose:
      - "9200"
      - "9300"
    networks:
      - meristem-observability

  opensearch-bootstrap:
    image: oven/bun:1.3.13-alpine
    restart: "no"
    environment:
      OPENSEARCH_URL: https://opensearch-manager:9200
      OPENSEARCH_ADMIN_USERNAME: ${OPENSEARCH_ADMIN_USERNAME:?inject from a SecretRef}
      OPENSEARCH_ADMIN_PASSWORD: ${OPENSEARCH_ADMIN_PASSWORD:?inject from a SecretRef}
      OPENSEARCH_SNAPSHOT_BUCKET: ${OPENSEARCH_SNAPSHOT_BUCKET:?set the managed snapshot bucket}
      OPENSEARCH_SNAPSHOT_REGION: ${OPENSEARCH_SNAPSHOT_REGION:?set the snapshot bucket region}
      OPENSEARCH_SNAPSHOT_BASE_PATH: ${OPENSEARCH_SNAPSHOT_BASE_PATH:-meristem/opensearch}
    volumes:
      - ./:/workspace:ro
      - ${MERISTEM_OPENSEARCH_TLS_DIR:?inject managed TLS material}:/workspace/tls:ro
    command: ["bun", "/workspace/scripts/bootstrap.ts"]
    depends_on:
      - opensearch-manager
    networks:
      - meristem-observability

  opensearch-dashboards:
    image: opensearchproject/opensearch-dashboards:2.19.1
    environment:
      OPENSEARCH_HOSTS: '["https://opensearch-manager:9200"]'
      OPENSEARCH_USERNAME: ${OPENSEARCH_DASHBOARDS_USERNAME:?inject from a SecretRef}
      OPENSEARCH_PASSWORD: ${OPENSEARCH_DASHBOARDS_PASSWORD:?inject from a SecretRef}
    volumes:
      - ./config/opensearch-dashboards.yml:/usr/share/opensearch-dashboards/config/opensearch_dashboards.yml:ro
      - ${MERISTEM_OPENSEARCH_TLS_DIR:?inject managed TLS material}:/usr/share/opensearch-dashboards/config/certs:ro
    expose:
      - "5601"
    depends_on:
      - opensearch-manager
    networks:
      - meristem-observability

  dashboards-oidc-proxy:
    image: quay.io/oauth2-proxy/oauth2-proxy:v7.7.1
    command:
      - --config=/etc/oauth2-proxy/oauth2-proxy.cfg
    environment:
      OAUTH2_PROXY_CLIENT_ID: ${DASHBOARDS_OIDC_CLIENT_ID:?inject from a SecretRef}
      OAUTH2_PROXY_CLIENT_SECRET: ${DASHBOARDS_OIDC_CLIENT_SECRET:?inject from a SecretRef}
      OAUTH2_PROXY_COOKIE_SECRET: ${DASHBOARDS_OIDC_COOKIE_SECRET:?inject from a SecretRef}
      OAUTH2_PROXY_OIDC_ISSUER_URL: ${DASHBOARDS_OIDC_ISSUER_URL:?set the trusted OIDC issuer}
    volumes:
      - ./config/oauth2-proxy.cfg:/etc/oauth2-proxy/oauth2-proxy.cfg:ro
      - ${MERISTEM_OPENSEARCH_TLS_DIR:?inject managed TLS material}:/etc/oauth2-proxy/certs:ro
    ports:
      - "127.0.0.1:8443:8443"
    depends_on:
      - opensearch-dashboards
    networks:
      - meristem-observability

  otel-collector:
    image: otel/opentelemetry-collector-contrib:0.112.0
    command: ["--config=/etc/otelcol-contrib/config.yaml"]
    environment:
      MERISTEM_ALERT_WEBHOOK_URL: ${MERISTEM_ALERT_WEBHOOK_URL:?inject the authenticated operations alert webhook}
    volumes:
      - ./config/otel-collector.yaml:/etc/otelcol-contrib/config.yaml:ro
      - ${MERISTEM_PINO_LOG_DIR:?mount the runtime JSONL log directory}:/var/log/meristem:ro
    expose:
      - "4317"
      - "4318"
      - "9464"
    networks:
      - meristem-observability

  prometheus:
    image: prom/prometheus:v2.54.1
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.path=/prometheus
      - --web.enable-lifecycle
    environment:
      OPENSEARCH_MONITORING_USERNAME: ${OPENSEARCH_MONITORING_USERNAME:?inject from a SecretRef}
      OPENSEARCH_MONITORING_PASSWORD: ${OPENSEARCH_MONITORING_PASSWORD:?inject from a SecretRef}
    volumes:
      - prometheus-data:/prometheus
      - ./config/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ./alerts/opensearch-alerts.yml:/etc/prometheus/rules/opensearch-alerts.yml:ro
      - ${MERISTEM_OPENSEARCH_TLS_DIR:?inject managed TLS material}:/etc/prometheus/certs:ro
    expose:
      - "9090"
    depends_on:
      - alertmanager
    networks:
      - meristem-observability

  alertmanager:
    image: prom/alertmanager:v0.27.0
    command:
      - --config.file=/etc/alertmanager/alertmanager.yml
    environment:
      MERISTEM_ALERT_WEBHOOK_URL: ${MERISTEM_ALERT_WEBHOOK_URL:?inject the authenticated operations alert webhook}
    volumes:
      - ./config/alertmanager.yml:/etc/alertmanager/alertmanager.yml:ro
    expose:
      - "9093"
    networks:
      - meristem-observability

  grafana:
    image: grafana/grafana:11.3.0
    environment:
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD:?inject from a SecretRef}
      GF_AUTH_ANONYMOUS_ENABLED: "false"
    volumes:
      - grafana-data:/var/lib/grafana
      - ./config/grafana-datasources.yml:/etc/grafana/provisioning/datasources/meristem.yml:ro
    expose:
      - "3000"
    depends_on:
      - prometheus
    networks:
      - meristem-observability

volumes:
  opensearch-manager-data:
  opensearch-data-data:
  opensearch-ingest-data:
  prometheus-data:
  grafana-data:

networks:
  meristem-observability:
    internal: true
