apiVersion: 1

datasources:
  - name: Prometheus
    type: prometheus
    access: proxy
    url: http://prometheus:9090
    isDefault: true
    editable: false
  - name: OpenSearch
    type: grafana-opensearch-datasource
    access: proxy
    url: https://opensearch-manager:9200
    jsonData:
      tlsSkipVerify: false
    editable: false
