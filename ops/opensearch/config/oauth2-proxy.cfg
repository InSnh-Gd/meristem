provider = "oidc"
scope = "openid profile email groups"
oidc_groups_claim = "groups"
allowed_groups = ["meristem-operator", "meristem-security-admin"]
upstreams = ["https://opensearch-dashboards:5601"]
http_address = "0.0.0.0:4180"
https_address = "0.0.0.0:8443"
tls_cert_file = "/etc/oauth2-proxy/certs/dashboards.pem"
tls_key_file = "/etc/oauth2-proxy/certs/dashboards-key.pem"
ssl_insecure_skip_verify = false
ssl_upstream_insecure_skip_verify = false
cookie_secure = true
cookie_httponly = true
cookie_samesite = "strict"
cookie_name = "__Host-meristem_dashboards"
set_xauthrequest = true
pass_authorization_header = false
pass_access_token = false
skip_provider_button = true
standard_logging = true
auth_logging = true
request_logging = true
logging_format = "json"
