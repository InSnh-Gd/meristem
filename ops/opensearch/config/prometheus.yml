global:
  scrape_interval: 30s
  evaluation_interval: 30s

rule_files:
  - /etc/prometheus/rules/*.yml

alerting:
  alertmanagers:
    - static_configs:
        - targets: [alertmanager:9093]

scrape_configs:
  - job_name: opensearch
    scheme: https
    metrics_path: /_prometheus/metrics
    tls_config:
      ca_file: /etc/prometheus/certs/ca.pem
      server_name: opensearch-manager
    basic_auth:
      username: ${OPENSEARCH_MONITORING_USERNAME}
      password: ${OPENSEARCH_MONITORING_PASSWORD}
    static_configs:
      - targets: [opensearch-manager:9200, opensearch-data:9200, opensearch-ingest:9200]

  - job_name: otel-collector
    static_configs:
      - targets: [otel-collector:9464]
